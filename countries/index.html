<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доступность по странам — ovyrn</title>
<link rel="stylesheet" href="/css/core.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<div class="countries-page">
  <div class="countries-top">
    <a href="/unavailable/" class="countries-back">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Назад
    </a>
  </div>

  <h1 style="font-family:var(--font-hero);font-weight:400;font-size:clamp(1.8rem,5vw,2.4rem)">Где работает <span class="rainbow-text">ovyrn</span></h1>
  <p>Сервис сейчас доступен в большинстве стран. Ниже — короткий список тех, где пока нет.</p>

  <div class="country-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="Найти страну…">
  </div>

  <div class="country-section">
    <div class="country-section-head"><h2>Доступно</h2><span id="okCount"></span></div>
    <div class="country-grid" id="okGrid"></div>
  </div>

  <div class="country-section restricted">
    <div class="country-section-head"><h2>Пока недоступно</h2><span id="noCount"></span></div>
    <div class="country-grid" id="noGrid"></div>
  </div>

  <div class="country-empty" id="emptyState">Ничего не найдено.</div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script>
  // Единый источник правды по недоступным странам — тот же список,
  // что использует /js/geoblock.js. Меняете один раз — там, добавляете
  // сюда для отображения (специально не импортируем как модуль, чтобы
  // страница работала без сборки; при добавлении бэкенда стоит отдавать
  // оба списка с одного эндпоинта).
  const restrictedCodes = {
    IR: 'Иран', AF: 'Афганистан', IQ: 'Ирак', UA: 'Украина', NG: 'Нигерия', NE: 'Нигер',
    MX: 'Мексика', SA: 'Саудовская Аравия', JO: 'Иордания', PK: 'Пакистан',
    IN: 'Индия', MM: 'Мьянма', BD: 'Бангладеш', NP: 'Непал', BT: 'Бутан',
    OM: 'Оман', YE: 'Йемен', QA: 'Катар', KW: 'Кувейт', BH: 'Бахрейн',
    CD: 'ДР Конго', CG: 'Конго', DZ: 'Алжир',
  };

  const available = [
    'Россия','Беларусь','Казахстан','Узбекистан','Кыргызстан','Таджикистан','Армения','Азербайджан','Грузия',
    'Германия','Франция','Испания','Италия','Нидерланды','Польша','Чехия','Швеция','Финляндия','Норвегия',
    'Великобритания','Ирландия','Португалия','Греция','Турция','Сербия','Хорватия','Болгария','Румыния',
    'США','Канада','Бразилия','Аргентина','Чили','Колумбия',
    'ОАЭ','Израиль','Кипр',
    'Китай','Япония','Южная Корея','Сингапур','Таиланд','Вьетнам','Малайзия','Индонезия','Филиппины',
    'ЮАР','Египет','Марокко',
    'Австралия','Новая Зеландия',
  ].sort((a, b) => a.localeCompare(b, 'ru'));

  const restricted = Object.values(restrictedCodes).sort((a, b) => a.localeCompare(b, 'ru'));

  const okGrid = document.getElementById('okGrid');
  const noGrid = document.getElementById('noGrid');
  document.getElementById('okCount').textContent = available.length;
  document.getElementById('noCount').textContent = restricted.length;

  function buildGrid(container, list) {
    container.innerHTML = list.map(name => `<div class="c" data-name="${name.toLowerCase()}">${name}</div>`).join('');
  }
  buildGrid(okGrid, available);
  buildGrid(noGrid, restricted);

  const emptyState = document.getElementById('emptyState');
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll('.c').forEach(el => {
      const match = el.dataset.name.includes(q);
      el.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    emptyState.style.display = visible === 0 ? 'block' : 'none';
  });
</script>

<script src="/js/nav-footer.js"></script>
<script src="/js/analytics.js"></script>
<script src="/js/site.js"></script>
</body>
</html>
