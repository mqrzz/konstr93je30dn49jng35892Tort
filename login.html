<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Flowgram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
<script src="nav-footer.js?v=4"></script>
</head>
<body class="auth-body">
<div class="auth-bg">
  <div class="auth-glow"></div>
  <svg viewBox="0 0 800 800" fill="none">
    <g stroke="rgba(255,255,255,.10)" stroke-width="1.2">
      <line x1="120" y1="180" x2="320" y2="280"/>
      <line x1="320" y1="280" x2="320" y2="480"/>
      <line x1="320" y1="480" x2="150" y2="600"/>
      <line x1="320" y1="480" x2="520" y2="560"/>
      <line x1="320" y1="280" x2="560" y2="220"/>
      <line x1="560" y1="220" x2="700" y2="320"/>
      <line x1="560" y1="220" x2="640" y2="80"/>
    </g>
    <g fill="rgba(255,255,255,.16)">
      <circle cx="120" cy="180" r="5"/>
      <circle cx="320" cy="280" r="6"/>
      <circle cx="320" cy="480" r="6"/>
      <circle cx="150" cy="600" r="5"/>
      <circle cx="520" cy="560" r="5"/>
      <circle cx="560" cy="220" r="6"/>
      <circle cx="700" cy="320" r="5"/>
      <circle cx="640" cy="80" r="5"/>
    </g>
  </svg>
</div>

<nav class="nav" style="border-bottom:1px solid var(--stroke);position:relative;z-index:1;">
  <div class="nav-inner" style="justify-content:center;padding:20px 0;">
    <a class="logo" href="index">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M8 7l2.5 8.5M16 7l-2.5 8.5"/></svg>
      Flowgram
    </a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-tabs" id="authTabs">
      <div class="auth-tabs-thumb"></div>
      <button class="active" id="tab-login" onclick="setMode('login')">Войти</button>
      <button id="tab-signup" onclick="setMode('signup')">Регистрация</button>
    </div>

    <h1 id="auth-title">С возвращением</h1>
    <p class="sub" id="auth-sub">Войдите, чтобы продолжить работу над ботами</p>

    <button class="oauth-btn"><svg width="18" height="18" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#FC3F1D"/><text x="12" y="16.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Я</text></svg> Продолжить с Яндекс ID</button>

    <div class="auth-divider">или по почте</div>

    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="you@example.com">
    </div>
    <div class="field collapsed" id="field-name">
      <label>Имя</label>
      <input type="text" placeholder="Как к вам обращаться">
    </div>
    <button class="auth-submit" id="submit-btn" onclick="submitAuth(this)">
      <span class="spinner"></span>
      <span class="btn-label" id="submit-label">Получить код на почту</span>
    </button>

    <p class="auth-foot" id="auth-foot">Ещё нет аккаунта? <a href="#" onclick="setMode('signup');return false;">Зарегистрироваться</a></p>
  </div>
</div>

<script src="script.js?v=4"></script>
</body>
</html>
