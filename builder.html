<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин одежды / builder — Flowgram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
<style>
html,body{height:100%;overflow:hidden;}
.builder{display:flex;flex-direction:column;height:100vh;}

/* TOP BAR */
.builder-top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--stroke);flex:none;background:var(--bg);z-index:20;}
.builder-top-left{display:flex;align-items:center;gap:14px;}
.builder-back{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex:none;}
.builder-back:hover{color:var(--text);border-color:var(--stroke-strong);}
.builder-back svg{width:15px;height:15px;}
.builder-title{font-size:14px;font-weight:600;}
.builder-title .dim{color:var(--text-faint);font-weight:400;}
.builder-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-faint);margin-top:2px;}
.builder-status .d{width:5px;height:5px;border-radius:50%;background:#7fd4a8;}
.builder-top-right{display:flex;align-items:center;gap:10px;}
.bbtn{font-size:13px;font-weight:600;padding:8px 16px;border-radius:100px;cursor:pointer;font-family:inherit;border:1px solid var(--stroke);background:var(--bg-elevated);color:var(--text);transition:border-color .15s,transform .15s;}
.bbtn:hover{border-color:var(--stroke-strong);}
.bbtn:active{transform:scale(.96);}
.bbtn-primary{background:#fff;color:#000;border-color:#fff;}
.bbtn-primary:hover{opacity:.9;}
.bbtn svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px;}

/* BODY LAYOUT */
.builder-body{flex:1;display:flex;overflow:hidden;position:relative;}

/* PALETTE */
.builder-palette{width:220px;flex:none;border-right:1px solid var(--stroke);padding:18px 14px;overflow-y:auto;background:#0a0a0a;}
.palette-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:14px 6px 8px;}
.palette-label:first-child{margin-top:0;}
.palette-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--stroke);background:var(--bg-elevated);margin-bottom:8px;cursor:grab;font-size:13px;transition:border-color .15s,transform .15s;user-select:none;}
.palette-item:hover{border-color:var(--stroke-strong);}
.palette-item:active{cursor:grabbing;transform:scale(.97);}
.palette-item .pi{width:26px;height:26px;border-radius:7px;background:#161616;border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-dim);}
.palette-item .pi svg{width:13px;height:13px;}
.palette-hint{font-size:12px;color:var(--text-faint);line-height:1.6;margin-top:20px;padding:12px;background:var(--bg-elevated);border:1px solid var(--stroke);border-radius:var(--radius-sm);}

/* CANVAS */
.builder-canvas-wrap{flex:1;position:relative;overflow:auto;background:
  radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0) 0 0/24px 24px;
  background-color:#08090a;cursor:grab;}
.builder-canvas-wrap.panning{cursor:grabbing;}
.builder-canvas{position:relative;width:2400px;height:1600px;}
.builder-canvas svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.edge-path{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.8;pointer-events:stroke;cursor:pointer;}
.edge-path:hover{stroke:#fff;}
.edge-path.selected{stroke:#fff;stroke-width:2.4;}
.edge-hit{fill:none;stroke:transparent;stroke-width:14px;pointer-events:stroke;cursor:pointer;}
.edge-label{font-size:10.5px;fill:var(--text-dim);font-family:'Inter',sans-serif;}
.temp-edge{stroke:rgba(255,255,255,.5);stroke-width:1.8;stroke-dasharray:4 4;fill:none;}

/* NODE */
.fnode{position:absolute;width:200px;background:var(--bg-elevated);border:1px solid var(--stroke);border-radius:var(--radius-md);
  box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:grab;user-select:none;}
.fnode.dragging{cursor:grabbing;opacity:.9;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:30;}
.fnode.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.35);}
.fnode.trigger{border-color:rgba(255,255,255,.35);}
.fnode-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--stroke);}
.fnode-head .fi{width:22px;height:22px;border-radius:6px;background:#161616;border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-dim);}
.fnode-head .fi svg{width:11px;height:11px;}
.fnode-head .ft{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fnode-del{width:18px;height:18px;border-radius:5px;display:none;align-items:center;justify-content:center;color:var(--text-faint);flex:none;}
.fnode-del:hover{color:#fff;background:rgba(255,255,255,.08);}
.fnode:hover .fnode-del{display:flex;}
.fnode-body{padding:10px 12px;font-size:12px;color:var(--text-dim);line-height:1.5;min-height:16px;max-height:70px;overflow:hidden;}
.fnode-body .ph{color:var(--text-faint);font-style:italic;}

.fnode-in{position:absolute;left:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:#0a0a0a;border:1.6px solid var(--text-dim);}
.fnode-outs{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--stroke);}
.fnode-out-row{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:7px 12px;font-size:11px;color:var(--text-dim);position:relative;border-top:1px solid var(--stroke-soft,rgba(255,255,255,.05));}
.fnode-out-row:first-child{border-top:none;}
.fnode-out{width:10px;height:10px;border-radius:50%;background:#0a0a0a;border:1.6px solid var(--text-dim);cursor:crosshair;flex:none;}
.fnode-out:hover{border-color:#fff;background:#fff;}
.fnode-out-row:hover .fnode-out{border-color:#fff;}

/* PROPS PANEL */
.builder-props{width:280px;flex:none;border-left:1px solid var(--stroke);padding:20px;overflow-y:auto;background:#0a0a0a;}
.props-empty{color:var(--text-faint);font-size:13px;text-align:center;margin-top:60px;line-height:1.6;}
.props-empty svg{width:28px;height:28px;margin:0 auto 14px;display:block;opacity:.4;}
.props-head{font-size:13px;font-weight:600;margin-bottom:4px;}
.props-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:20px;}
.pfield{margin-bottom:16px;}
.pfield label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.pfield input,.pfield textarea,.pfield select{width:100%;background:var(--bg-elevated);border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;}
.pfield textarea{resize:vertical;min-height:70px;}
.pfield input:focus,.pfield textarea:focus,.pfield select:focus{outline:none;border-color:rgba(255,255,255,.4);}
.pbtn-row{display:flex;gap:8px;margin-bottom:8px;}
.pbtn-row input{flex:1;}
.pbtn-row button{width:30px;flex:none;border:1px solid var(--stroke);background:var(--bg-elevated);border-radius:var(--radius-sm);color:var(--text-faint);cursor:pointer;}
.pbtn-row button:hover{color:#fff;border-color:var(--stroke-strong);}
.padd-btn{width:100%;padding:9px;border:1px dashed var(--stroke-strong);border-radius:var(--radius-sm);background:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;font-family:inherit;}
.padd-btn:hover{color:#fff;border-color:#fff;}

/* JSON PANEL */
.builder-json{flex:none;border-top:1px solid var(--stroke);background:#0a0a0a;transition:height .25s;height:36px;overflow:hidden;}
.builder-json.open{height:220px;}
.json-toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 20px;cursor:pointer;font-size:12px;color:var(--text-dim);}
.json-toggle svg{width:13px;height:13px;transition:transform .2s;}
.builder-json.open .json-toggle svg{transform:rotate(180deg);}
.json-body{padding:0 20px 16px;font-family:var(--mono);font-size:12px;color:#c9c9c9;white-space:pre;overflow:auto;height:170px;}

/* TEST MODAL */
.test-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:center;justify-content:center;}
.test-overlay.open{display:flex;}
.test-modal{width:340px;background:var(--bg-elevated);border:1px solid var(--stroke);border-radius:var(--radius-lg);overflow:hidden;}
.test-modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--stroke);font-size:13px;font-weight:600;}
.test-close{color:var(--text-faint);cursor:pointer;}
.test-close:hover{color:#fff;}
.test-body{padding:18px;height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#08090a;}
.test-bubble{background:#161616;border-radius:var(--radius-md);padding:10px 14px;font-size:13px;max-width:85%;line-height:1.5;opacity:0;animation:tb-in .3s forwards;}
.test-bubble.btns{display:flex;flex-direction:column;gap:6px;background:none;padding:0;max-width:100%;}
.test-bubble.btns button{background:#161616;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;color:var(--text);cursor:pointer;font-family:inherit;text-align:left;}
.test-bubble.btns button:hover{border-color:var(--stroke-strong);}
@keyframes tb-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.test-end{text-align:center;color:var(--text-faint);font-size:12px;padding:10px 0;}
.test-restart{margin:14px 18px 18px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;
  padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:100;pointer-events:none;
  display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:14px;height:14px;}

@media(max-width:900px){
  .builder-palette,.builder-props{position:fixed;top:57px;bottom:0;z-index:40;transition:transform .25s;}
  .builder-palette{left:0;transform:translateX(-100%);}
  .builder-palette.open{transform:translateX(0);}
  .builder-props{right:0;transform:translateX(100%);}
  .builder-props.open{transform:translateX(0);}
}

</style>
</head>
<body>
<div class="builder">
  <div class="builder-top">
    <div class="builder-top-left">
      <a class="builder-back" href="#" onclick="return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
      <button class="builder-back" id="paletteToggleBtn" onclick="togglePanel('palette')" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div>
        <div class="builder-title">Магазин одежды <span class="dim">/ builder</span></div>
        <div class="builder-status"><span class="d"></span>Все изменения сохранены</div>
      </div>
    </div>
    <div class="builder-top-right">
      <button class="bbtn" onclick="openTest()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>Тест</button>
      <button class="bbtn bbtn-primary" onclick="publish()">Опубликовать</button>
      <button class="builder-back" id="propsToggleBtn" onclick="togglePanel('props')" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    </div>
  </div>

  <div class="builder-body">
    <aside class="builder-palette" id="palette">
      <div class="palette-label">Добавить блок</div>
      <div class="palette-item" draggable="true" data-type="message">
        <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-8.9 8.4 8.5 8.5 0 01-4-1L3 20l1.3-4a8.4 8.4 0 01-1-4A8.4 8.4 0 0112 3a8.5 8.5 0 019 8.5z"/></svg></span>
        Сообщение
      </div>
      <div class="palette-item" draggable="true" data-type="buttons">
        <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="3"/></svg></span>
        Кнопки
      </div>
      <div class="palette-item" draggable="true" data-type="condition">
        <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v12a3 3 0 003 3h9M6 3L3 6m3-3l3 3M15 6l3-3 3 3"/></svg></span>
        Условие
      </div>
      <div class="palette-item" draggable="true" data-type="payment">
        <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>
        Оплата
      </div>
      <div class="palette-item" draggable="true" data-type="delay">
        <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
        Задержка
      </div>
      <div class="palette-item" draggable="true" data-type="http">
        <span class="pi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
        HTTP-запрос
      </div>
      <div class="palette-hint">Перетащите блок на канвас. Соединяйте, потянув от точки справа на ноде к следующему блоку.</div>
    </aside>

    <div class="builder-canvas-wrap" id="canvasWrap">
      <div class="builder-canvas" id="canvas">
        <svg id="edgesSvg"><g id="edgesLayer"></g></svg>
      </div>
    </div>

    <aside class="builder-props" id="props">
      <div class="props-empty" id="propsEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Выберите блок на канвасе,<br>чтобы отредактировать его
      </div>
      <div id="propsForm" style="display:none;"></div>
    </aside>
  </div>

  <div class="builder-json" id="jsonPanel">
    <div class="json-toggle" onclick="toggleJson()">
      <span>scenario.json</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="json-body" id="jsonBody"></div>
  </div>
</div>

<div class="test-overlay" id="testOverlay">
  <div class="test-modal">
    <div class="test-modal-head">
      <span>Тестовый запуск</span>
      <span class="test-close" onclick="closeTest()">✕</span>
    </div>
    <div class="test-body" id="testBody"></div>
  </div>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg><span id="toastText"></span></div>

<script>
/* ============ NODE TYPE DEFINITIONS ============ */
const ICONS = {
  trigger: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
  message: '<path d="M21 11.5a8.4 8.4 0 01-8.9 8.4 8.5 8.5 0 01-4-1L3 20l1.3-4a8.4 8.4 0 01-1-4A8.4 8.4 0 0112 3a8.5 8.5 0 019 8.5z"/>',
  buttons: '<rect x="3" y="7" width="18" height="10" rx="3"/>',
  condition: '<path d="M6 3v12a3 3 0 003 3h9M6 3L3 6m3-3l3 3M15 6l3-3 3 3"/>',
  payment: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  delay: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  http: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
};
const LABELS = {
  trigger: '/start', message: 'Сообщение', buttons: 'Кнопки', condition: 'Условие',
  payment: 'Оплата', delay: 'Задержка', http: 'HTTP-запрос',
};
function nodeOutputs(node) {
  if (node.type === 'buttons') return (node.data.buttons && node.data.buttons.length ? node.data.buttons : ['Кнопка 1']);
  if (node.type === 'condition') return ['Да', 'Нет'];
  if (node.type === 'payment') return ['Оплачено', 'Не оплачено'];
  return ['→'];
}
function nodePreview(node) {
  const d = node.data || {};
  switch (node.type) {
    case 'trigger': return '<span class="ph">Точка входа в сценарий</span>';
    case 'message': return d.text ? escapeHtml(d.text) : '<span class="ph">Введите текст сообщения…</span>';
    case 'buttons': return (d.buttons || ['Кнопка 1']).map(escapeHtml).join(' · ');
    case 'condition': return d.variable ? `если <b>${escapeHtml(d.variable)}</b> = ${escapeHtml(d.value||'')}` : '<span class="ph">Задайте условие…</span>';
    case 'payment': return d.amount ? `Счёт на ${escapeHtml(d.amount)} ₽` : '<span class="ph">Укажите сумму…</span>';
    case 'delay': return d.seconds ? `Пауза ${escapeHtml(d.seconds)} сек` : '<span class="ph">Укажите паузу…</span>';
    case 'http': return d.url ? escapeHtml(d.url) : '<span class="ph">Укажите URL…</span>';
    default: return '';
  }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ STATE ============ */
let nodes = [
  { id: 'n1', type: 'trigger', x: 560, y: 80, data: {} },
  { id: 'n2', type: 'message', x: 540, y: 200, data: { text: 'Добро пожаловать! Выберите раздел 👇' } },
  { id: 'n3', type: 'buttons', x: 520, y: 340, data: { buttons: ['Каталог', 'Поддержка'] } },
];
let edges = [
  { id: 'e1', from: 'n1', fromPort: 0, to: 'n2' },
  { id: 'e2', from: 'n2', fromPort: 0, to: 'n3' },
];
let selectedNodeId = null;
let selectedEdgeId = null;
let idCounter = 4;
let connecting = null; // {nodeId, port, x1, y1}
let dragState = null;  // {id, offX, offY}
let panState = null;

const canvas = document.getElementById('canvas');
const canvasWrap = document.getElementById('canvasWrap');
const svg = document.getElementById('edgesSvg');
const edgesLayer = document.getElementById('edgesLayer');

/* ============ RENDER ============ */
function render() {
  renderNodes();
  renderEdges();
  renderProps();
  renderJson();
}

function renderNodes() {
  canvas.querySelectorAll('.fnode').forEach(el => el.remove());
  nodes.forEach(node => {
    const el = document.createElement('div');
    el.className = 'fnode' + (node.type === 'trigger' ? ' trigger' : '') + (selectedNodeId === node.id ? ' selected' : '');
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    el.dataset.id = node.id;

    const outs = nodeOutputs(node);
    let outsHtml = outs.map((label, i) => `
      <div class="fnode-out-row">
        <span>${escapeHtml(label)}</span>
        <div class="fnode-out" data-node="${node.id}" data-port="${i}"></div>
      </div>`).join('');

    el.innerHTML = `
      ${node.type !== 'trigger' ? '<div class="fnode-in"></div>' : ''}
      <div class="fnode-head">
        <span class="fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[node.type]}</svg></span>
        <span class="ft">${node.type === 'trigger' ? '/start' : LABELS[node.type]}</span>
        ${node.type !== 'trigger' ? '<span class="fnode-del" data-del="'+node.id+'">✕</span>' : ''}
      </div>
      <div class="fnode-body">${nodePreview(node)}</div>
      <div class="fnode-outs">${outsHtml}</div>
    `;
    canvas.appendChild(el);
  });

  // interaction bindings
  canvas.querySelectorAll('.fnode').forEach(el => {
    el.addEventListener('pointerdown', onNodePointerDown);
  });
  canvas.querySelectorAll('.fnode-out').forEach(el => {
    el.addEventListener('pointerdown', onPortPointerDown);
  });
  canvas.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('pointerdown', e => { e.stopPropagation(); deleteNode(el.dataset.del); });
  });
}

function portPos(nodeId, kind, portIndex) {
  const sel = kind === 'in' ? `.fnode[data-id="${nodeId}"] .fnode-in` : `.fnode[data-id="${nodeId}"] .fnode-out[data-port="${portIndex}"]`;
  const el = canvas.querySelector(sel);
  if (!el) return null;
  const cr = canvas.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2 - cr.left, y: r.top + r.height/2 - cr.top };
}

function renderEdges() {
  edgesLayer.innerHTML = '';
  edges.forEach(edge => {
    const p1 = portPos(edge.from, 'out', edge.fromPort);
    const p2 = portPos(edge.to, 'in');
    if (!p1 || !p2) return;
    drawEdgePath(p1, p2, edge.id, selectedEdgeId === edge.id);
  });
}

function drawEdgePath(p1, p2, id, selected) {
  const dx = Math.max(60, Math.abs(p2.x - p1.x) * 0.5);
  const d = `M${p1.x} ${p1.y} C ${p1.x+dx} ${p1.y}, ${p2.x-dx} ${p2.y}, ${p2.x} ${p2.y}`;
  const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
  hit.setAttribute('d', d); hit.setAttribute('class','edge-hit');
  if (id) hit.addEventListener('pointerdown', e => { e.stopPropagation(); selectEdge(id); });
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', d); path.setAttribute('class', 'edge-path' + (selected ? ' selected' : ''));
  edgesLayer.appendChild(hit);
  edgesLayer.appendChild(path);
}

/* ============ PROPS PANEL ============ */
function renderProps() {
  const empty = document.getElementById('propsEmpty');
  const form = document.getElementById('propsForm');
  const node = nodes.find(n => n.id === selectedNodeId);
  if (!node) { empty.style.display='block'; form.style.display='none'; form.innerHTML=''; return; }
  empty.style.display='none'; form.style.display='block';

  let html = `<div class="props-head">${node.type === 'trigger' ? '/start' : LABELS[node.type]}</div>
    <div class="props-sub">ID: ${node.id}</div>`;

  const d = node.data;
  if (node.type === 'message') {
    html += `<div class="pfield"><label>Текст сообщения</label><textarea oninput="updateField('${node.id}','text',this.value)">${escapeHtml(d.text||'')}</textarea></div>`;
  } else if (node.type === 'buttons') {
    html += `<div class="pfield"><label>Кнопки</label>`;
    (d.buttons || ['Кнопка 1']).forEach((b, i) => {
      html += `<div class="pbtn-row"><input value="${escapeHtml(b)}" oninput="updateButtonLabel('${node.id}',${i},this.value)"><button onclick="removeButton('${node.id}',${i})">✕</button></div>`;
    });
    html += `</div><button class="padd-btn" onclick="addButton('${node.id}')">+ Добавить кнопку</button>`;
  } else if (node.type === 'condition') {
    html += `<div class="pfield"><label>Переменная</label><input value="${escapeHtml(d.variable||'')}" placeholder="например, orders_count" oninput="updateField('${node.id}','variable',this.value)"></div>
      <div class="pfield"><label>Значение для сравнения</label><input value="${escapeHtml(d.value||'')}" oninput="updateField('${node.id}','value',this.value)"></div>`;
  } else if (node.type === 'payment') {
    html += `<div class="pfield"><label>Сумма, ₽</label><input type="number" value="${escapeHtml(d.amount||'')}" oninput="updateField('${node.id}','amount',this.value)"></div>`;
  } else if (node.type === 'delay') {
    html += `<div class="pfield"><label>Пауза, секунд</label><input type="number" value="${escapeHtml(d.seconds||'')}" oninput="updateField('${node.id}','seconds',this.value)"></div>`;
  } else if (node.type === 'http') {
    html += `<div class="pfield"><label>URL</label><input value="${escapeHtml(d.url||'')}" placeholder="https://" oninput="updateField('${node.id}','url',this.value)"></div>`;
  } else {
    html += `<p style="font-size:12.5px;color:var(--text-faint);">Это точка входа сценария — у неё нет настроек.</p>`;
  }
  form.innerHTML = html;
}

function updateField(nodeId, key, val) {
  const node = nodes.find(n => n.id === nodeId);
  node.data[key] = val;
  renderNodes(); renderEdges(); renderJson();
  reselectVisual();
}
function updateButtonLabel(nodeId, i, val) {
  const node = nodes.find(n => n.id === nodeId);
  node.data.buttons[i] = val;
  renderNodes(); renderEdges(); renderJson();
  reselectVisual();
}
function addButton(nodeId) {
  const node = nodes.find(n => n.id === nodeId);
  node.data.buttons = node.data.buttons || ['Кнопка 1'];
  node.data.buttons.push('Кнопка ' + (node.data.buttons.length + 1));
  render();
}
function removeButton(nodeId, i) {
  const node = nodes.find(n => n.id === nodeId);
  node.data.buttons.splice(i, 1);
  edges = edges.filter(e => !(e.from === nodeId && e.fromPort === i));
  edges.forEach(e => { if (e.from === nodeId && e.fromPort > i) e.fromPort--; });
  render();
}
function reselectVisual(){
  const el = canvas.querySelector(`.fnode[data-id="${selectedNodeId}"]`);
  if (el) el.classList.add('selected');
}

/* ============ NODE DRAG ============ */
function onNodePointerDown(e) {
  if (e.target.closest('.fnode-out') || e.target.closest('.fnode-del')) return;
  const el = e.currentTarget;
  const id = el.dataset.id;
  selectNode(id);
  const node = nodes.find(n => n.id === id);
  dragState = { id, offX: e.clientX - node.x, offY: e.clientY - node.y, moved:false };
  el.classList.add('dragging');
  el.setPointerCapture(e.pointerId);
  e.stopPropagation();
}
canvas.addEventListener('pointermove', e => {
  if (dragState) {
    const node = nodes.find(n => n.id === dragState.id);
    node.x = Math.max(0, e.clientX - dragState.offX);
    node.y = Math.max(0, e.clientY - dragState.offY);
    dragState.moved = true;
    const el = canvas.querySelector(`.fnode[data-id="${node.id}"]`);
    if (el) { el.style.left = node.x+'px'; el.style.top = node.y+'px'; }
    renderEdges();
  } else if (connecting) {
    const cr = canvas.getBoundingClientRect();
    const x2 = e.clientX - cr.left, y2 = e.clientY - cr.top;
    let temp = document.getElementById('tempEdge');
    if (!temp) {
      temp = document.createElementNS('http://www.w3.org/2000/svg','path');
      temp.setAttribute('id','tempEdge'); temp.setAttribute('class','temp-edge');
      edgesLayer.appendChild(temp);
    }
    const dx = Math.max(60, Math.abs(x2 - connecting.x1) * 0.5);
    temp.setAttribute('d', `M${connecting.x1} ${connecting.y1} C ${connecting.x1+dx} ${connecting.y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);
  }
});
window.addEventListener('pointerup', e => {
  if (dragState) {
    const el = canvas.querySelector(`.fnode[data-id="${dragState.id}"]`);
    if (el) el.classList.remove('dragging');
    dragState = null;
    renderJson();
  }
  if (connecting) {
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const nodeEl = target && target.closest('.fnode');
    const temp = document.getElementById('tempEdge');
    if (temp) temp.remove();
    if (nodeEl && nodeEl.dataset.id !== connecting.nodeId) {
      edges.push({ id: 'e'+(idCounter++), from: connecting.nodeId, fromPort: connecting.port, to: nodeEl.dataset.id });
      renderEdges(); renderJson();
    }
    connecting = null;
  }
});

function onPortPointerDown(e) {
  e.stopPropagation();
  const nodeId = e.currentTarget.dataset.node;
  const port = parseInt(e.currentTarget.dataset.port, 10);
  const p = portPos(nodeId, 'out', port);
  connecting = { nodeId, port, x1: p.x, y1: p.y };
}

/* ============ SELECTION ============ */
function selectNode(id) {
  selectedNodeId = id; selectedEdgeId = null;
  canvas.querySelectorAll('.fnode').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
  renderEdges(); renderProps();
}
function selectEdge(id) {
  selectedEdgeId = id; selectedNodeId = null;
  canvas.querySelectorAll('.fnode').forEach(el => el.classList.remove('selected'));
  renderEdges(); renderProps();
}
canvasWrap.addEventListener('pointerdown', e => {
  if (e.target === canvasWrap || e.target === canvas) {
    selectedNodeId = null; selectedEdgeId = null;
    renderNodes(); renderEdges(); renderProps();
    startPan(e);
  }
});
function startPan(e) {
  panState = { startX: e.clientX, startY: e.clientY, scrollLeft: canvasWrap.scrollLeft, scrollTop: canvasWrap.scrollTop };
  canvasWrap.classList.add('panning');
  function onMove(ev) {
    canvasWrap.scrollLeft = panState.scrollLeft - (ev.clientX - panState.startX);
    canvasWrap.scrollTop = panState.scrollTop - (ev.clientY - panState.startY);
  }
  function onUp() {
    canvasWrap.classList.remove('panning');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedNodeId) deleteNode(selectedNodeId);
    else if (selectedEdgeId) { edges = edges.filter(ed => ed.id !== selectedEdgeId); selectedEdgeId=null; render(); }
  }
});

/* ============ ADD / DELETE NODES ============ */
function addNode(type, x, y) {
  const id = 'n' + (idCounter++);
  const defaults = { buttons: ['Кнопка 1'] };
  nodes.push({ id, type, x: x-100, y: y-20, data: type==='buttons' ? {buttons:['Кнопка 1']} : {} });
  selectNode(id);
  render();
}
function deleteNode(id) {
  nodes = nodes.filter(n => n.id !== id);
  edges = edges.filter(e => e.from !== id && e.to !== id);
  if (selectedNodeId === id) selectedNodeId = null;
  render();
}

/* ============ PALETTE: drag & drop + click ============ */
document.querySelectorAll('.palette-item').forEach(item => {
  item.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', item.dataset.type);
  });
  item.addEventListener('click', () => {
    const wrapRect = canvasWrap.getBoundingClientRect();
    addNode(item.dataset.type, canvasWrap.scrollLeft + wrapRect.width/2, canvasWrap.scrollTop + 140);
  });
});
canvasWrap.addEventListener('dragover', e => e.preventDefault());
canvasWrap.addEventListener('drop', e => {
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  if (!type) return;
  const cr = canvas.getBoundingClientRect();
  addNode(type, e.clientX - cr.left, e.clientY - cr.top);
});

/* ============ JSON PREVIEW ============ */
function toScenarioJson() {
  const trigger = nodes.find(n => n.type === 'trigger');
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const nextOf = (id, port) => { const e = edges.find(e => e.from===id && e.fromPort===port); return e ? e.to : null; };
  const scenario = {
    trigger: trigger ? '/start' : null,
    nodes: nodes.map(n => {
      const outs = nodeOutputs(n);
      const next = {};
      outs.forEach((label,i) => { next[label] = nextOf(n.id, i); });
      return { id: n.id, type: n.type, data: n.data, next };
    })
  };
  return JSON.stringify(scenario, null, 2);
}
function renderJson() {
  document.getElementById('jsonBody').textContent = toScenarioJson();
}
function toggleJson() {
  document.getElementById('jsonPanel').classList.toggle('open');
}

/* ============ TOP BAR ACTIONS ============ */
function publish() {
  showToast('Опубликовано — версия сохранена');
}
function showToast(text) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============ TEST SIMULATION ============ */
function openTest() {
  document.getElementById('testOverlay').classList.add('open');
  runTestFrom(nodes.find(n => n.type === 'trigger'));
}
function closeTest() {
  document.getElementById('testOverlay').classList.remove('open');
}
function testBubble(html, cls) {
  const body = document.getElementById('testBody');
  const b = document.createElement('div');
  b.className = 'test-bubble ' + (cls||'');
  b.innerHTML = html;
  body.appendChild(b);
  body.scrollTop = body.scrollHeight;
  return b;
}
function runTestFrom(node) {
  const body = document.getElementById('testBody');
  body.innerHTML = '';
  if (!node) { testBubble('Добавьте блок <b>/start</b>, чтобы протестировать сценарий.'); return; }
  step(node);
}
function step(node) {
  if (!node) {
    document.getElementById('testBody').insertAdjacentHTML('beforeend', '<div class="test-end">— сценарий закончился здесь —</div>');
    const body = document.getElementById('testBody'); body.scrollTop = body.scrollHeight;
    return;
  }
  const outs = nodeOutputs(node);
  const nextOf = (port) => { const e = edges.find(e => e.from===node.id && e.fromPort===port); return e ? nodes.find(n=>n.id===e.to) : null; };

  setTimeout(() => {
    if (node.type === 'trigger') {
      step(nextOf(0));
    } else if (node.type === 'message') {
      testBubble(escapeHtml(node.data.text || '(пустое сообщение)'));
      setTimeout(() => step(nextOf(0)), 500);
    } else if (node.type === 'delay') {
      testBubble(`⏳ пауза ${node.data.seconds || 0} сек`, '');
      setTimeout(() => step(nextOf(0)), 600);
    } else if (node.type === 'http') {
      testBubble(`🌐 запрос к ${escapeHtml(node.data.url || 'внешнему API')}`, '');
      setTimeout(() => step(nextOf(0)), 600);
    } else if (node.type === 'buttons' || node.type === 'condition' || node.type === 'payment') {
      const b = testBubble(outs.map((label,i) => `<button onclick="handleTestChoice('${node.id}',${i})">${escapeHtml(label)}</button>`).join(''), 'btns');
    }
  }, 350);
}
function handleTestChoice(nodeId, port) {
  const node = nodes.find(n => n.id === nodeId);
  const outs = nodeOutputs(node);
  document.querySelectorAll('.test-bubble.btns button').forEach(b => b.disabled = true);
  testBubble(escapeHtml(outs[port]), '')  ;
  const el = document.querySelectorAll('.test-bubble')[document.querySelectorAll('.test-bubble').length-1];
  el.style.marginLeft = 'auto'; el.style.background = 'rgba(255,255,255,.1)';
  const e = edges.find(e => e.from===nodeId && e.fromPort===port);
  step(e ? nodes.find(n=>n.id===e.to) : null);
}

/* ============ MOBILE PANEL TOGGLES ============ */
function togglePanel(which) {
  const el = document.getElementById(which);
  el.classList.toggle('open');
}
function checkMobile() {
  const mobile = window.innerWidth <= 900;
  document.getElementById('paletteToggleBtn').style.display = mobile ? 'flex' : 'none';
  document.getElementById('propsToggleBtn').style.display = mobile ? 'flex' : 'none';
}
window.addEventListener('resize', checkMobile);
checkMobile();

/* ============ INIT ============ */
render();

</script>
</body>
