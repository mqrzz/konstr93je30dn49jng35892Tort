<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geserd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 32px;
    position: relative;
    overflow-x: hidden;
    text-align: center;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(253,253,253,0.09), transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 100%, rgba(240,240,228,0.05), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    max-width: 62rem;
  }

  h1 {
    font-family: 'Fraunces', ui-sans-serif, system-ui, serif;
    font-weight: 500;
    font-size: clamp(3rem, 7vw, 6rem);
    letter-spacing: -0.01em;
    line-height: 1.2;
    padding-bottom: 0.15em;
    margin: 0 0 1.5rem;
    background: linear-gradient(to right bottom, #fff 30%, rgba(255,255,255,0.5));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  p {
    font-size: 1.25rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.55);
    margin: 0 auto;
    max-width: 34rem;
  }

  .brand {
    position: fixed;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.28);
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="content">
    <h1>Geserd is not available in your region</h1>
    <p>Access to Geserd is currently restricted in your region due to local regulatory and licensing requirements. Availability may change depending on your country's laws and our provider agreements.</p>
  </div>
  <div class="brand">GESERD</div>
</body>
</html>
