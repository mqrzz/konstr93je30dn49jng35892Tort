<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowgram — скоро</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    min-height: 100vh;
    background: #0a0a0a;
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow: hidden;
    cursor: not-allowed;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 30% 40%, rgba(80, 80, 80, 0.15), transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M10 10 L 90 10 M10 30 L 90 30 M10 50 L 90 50 M10 70 L 90 70 M10 90 L 90 90" stroke="rgba(255,255,255,0.02)" stroke-width="1"/></svg>');
    opacity: 0.3;
    pointer-events: none;
  }

  .construction-card {
    position: relative;
    z-index: 10;
    max-width: 720px;
    width: 100%;
    background: rgba(18, 18, 18, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 40px;
    padding: 3.5rem 3rem;
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    text-align: center;
    cursor: default;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(24px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  h1 {
    font-family: 'Outfit', 'Inter', sans-serif;
    font-size: clamp(2.4rem, 8vw, 3.8rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 1.5rem;
    background: linear-gradient(135deg, #ffffff 0%, #b0b0b0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtext {
    font-size: clamp(1rem, 3vw, 1.2rem);
    line-height: 1.6;
    color: #a0a0a0;
    max-width: 500px;
    margin: 0 auto;
  }

  @media (max-width: 600px) {
    .construction-card {
      padding: 2.5rem 1.8rem;
      border-radius: 28px;
    }
  }
</style>
</head>
<body>
  <div class="construction-card">
    <h1>Сайт ещё не готов</h1>
    <p class="subtext">
      Мы активно работаем над новой версией Flowgram. 
      Совсем скоро здесь появится полноценный конструктор Telegram-ботов.
    </p>
  </div>

  <script>
    (function() {
      const blockAll = (e) => {
        e.preventDefault();
        e.stopPropagation();
        return false;
      };

      const eventsToBlock = [
        'click', 'mousedown', 'mouseup', 'mousemove', 'mouseover', 'mouseout',
        'contextmenu', 'dblclick', 'keydown', 'keypress', 'keyup',
        'touchstart', 'touchmove', 'touchend', 'touchcancel',
        'pointerdown', 'pointerup', 'pointermove', 'pointerover', 'pointerout',
        'drag', 'dragstart', 'dragend', 'dragenter', 'dragleave', 'dragover', 'drop',
        'scroll', 'wheel', 'focus', 'blur', 'input', 'change', 'submit', 'reset'
      ];

      eventsToBlock.forEach(eventType => {
        document.addEventListener(eventType, blockAll, { capture: true, passive: false });
      });

      document.addEventListener('selectstart', blockAll, { capture: true });
      document.addEventListener('contextmenu', blockAll, { capture: true });
      document.body.onclick = blockAll;
      document.body.onmousedown = blockAll;
      document.body.onmouseup = blockAll;
      document.body.onkeydown = blockAll;
      document.body.ontouchstart = blockAll;
    })();
  </script>
</body>
</html>
