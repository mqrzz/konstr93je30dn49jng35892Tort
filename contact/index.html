<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact — Geserd</title>
<meta name="description" content="Questions about the API, Enterprise pricing, a bug or a vulnerability: write to us.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/assets/favicon.svg?v=519359ff5f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/geserd.css?v=519359ff5f">
</head>
<body>
<div id="site-header"></div>
<main>
<section class="pg pgc"><div class="wrap"><h1 class="grad" data-i18n="ct.h1">Talk to us</h1><p data-i18n="ct.lead">Questions about the API, Enterprise pricing, a bug you found or a vulnerability to report: pick the right topic below and we will reply as soon as we can.</p></div></section>
<section class="sec scf"><div class="wrap cform-wrap">
<form class="cform glowcard" id="cform" novalidate>
 <p class="cl" data-i18n="ct2.topic">Topic</p>
 <div class="tcards"><label class="tcard"><input type="radio" name="topic" value="general" checked><span class="tc"><span class="gi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><b data-i18n="ct.g0.t">General and support</b><em data-i18n="ct.g0.p">Questions about your account, sending, receiving or anything that does not fit elsewhere.</em></span></label><label class="tcard"><input type="radio" name="topic" value="sales"><span class="tc"><span class="gi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span><b data-i18n="ct.g1.t">Sales and Enterprise</b><em data-i18n="ct.g1.p">Custom limits, a dedicated IP, or anything about the Enterprise plan.</em></span></label><label class="tcard"><input type="radio" name="topic" value="security"><span class="tc"><span class="gi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg></span><b data-i18n="ct.g2.t">Security</b><em data-i18n="ct.g2.p">Report a vulnerability or a security concern. See the security page for how we handle secrets.</em></span></label><label class="tcard"><input type="radio" name="topic" value="abuse"><span class="tc"><span class="gi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg></span><b data-i18n="ct.g3.t">Abuse</b><em data-i18n="ct.g3.p">Report spam, phishing or other abuse sent through Geserd.</em></span></label></div>
 <div class="two"><label class="cf"><span data-i18n="ct2.name">Name</span><input name="name" type="text" autocomplete="name" maxlength="80"></label>
 <label class="cf"><span data-i18n="ct2.email">Email</span><input name="email" type="email" autocomplete="email" inputmode="email" required></label></div>
 <label class="cf"><span data-i18n="ct2.msg">How can we help?</span><textarea name="message" rows="7" maxlength="5000" required data-i18n-ph="ct2.ph" placeholder=""></textarea></label>
 <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
 <p class="auth-err" id="cerr" hidden></p>
 <button class="btn pri" type="submit" id="csend"><span data-i18n="ct2.send">Send message</span></button>
</form>
<div class="cdone glowcard" id="cdone" hidden><span class="gi big"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.3 2.4 2.4 4.6-5"/></svg></span><h2 data-i18n="ct2.ok.h">Message sent</h2><p data-i18n="ct2.ok.p">Thank you.</p></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="/js/boot.js?v=519359ff5f"></script>
<script src="/js/pages/contact.js?v=519359ff5f"></script>
</body>
</html>
