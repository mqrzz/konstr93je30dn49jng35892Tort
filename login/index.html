<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log in — Geserd</title>
<meta name="description" content="Log in to your Geserd account to manage domains, API keys and sending.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/geserd.css">
</head>
<body class="auth-body" data-mode="login">
<div class="auth-shell">
  <div class="auth-bgimg"><img src="/assets/auth-bg.webp" alt=""></div>
  <a class="auth-home" href="/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span data-i18n="auth.home">Home</span></a>
  <main class="auth-main">
    <div id="authStep1">
      <div class="auth-top">
        <img class="mark" src="/assets/logo-mark.svg" alt="Geserd">
        <h1 data-i18n="auth.login.h1">Log in to Geserd</h1>
        <p><span data-i18n="auth.foot.tosignup">Don't have an account?</span> <a href="/signup/" data-i18n="auth.foot.signuplink">Sign up</a>.</p>
      </div>
      <div class="auth-oauth" id="oauthRow" data-ready="0">
        <button type="button" class="gbtn" id="o-google" data-provider="google" hidden><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M20 12.2c0-.6-.05-1.2-.15-1.7H12v3.2h4.5a3.9 3.9 0 0 1-1.7 2.5v2.1h2.7c1.6-1.5 2.5-3.6 2.5-6.1z"/><path fill="#34A853" d="M12 20.4c2.3 0 4.2-.8 5.5-2.1l-2.7-2.1c-.7.5-1.7.8-2.8.8-2.2 0-4-1.5-4.7-3.4H4.5v2.1a8.4 8.4 0 0 0 7.5 4.7z"/><path fill="#FBBC05" d="M7.3 13.6a5 5 0 0 1 0-3.2V8.3H4.5a8.4 8.4 0 0 0 0 7.4z"/><path fill="#EA4335" d="M12 6.9c1.2 0 2.3.4 3.2 1.2l2.4-2.4A8.4 8.4 0 0 0 4.5 8.3l2.8 2.1C8 8.4 9.8 6.9 12 6.9z"/></svg><span class="lbl" data-i18n="auth.o.google.login">x</span><span class="dots"><i></i><i></i><i></i></span></button>
        <button type="button" class="gbtn" id="o-github" data-provider="github" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.88 3.75-3.66 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 12 4z"/></svg><span class="lbl" data-i18n="auth.o.github.login">x</span><span class="dots"><i></i><i></i><i></i></span></button>
        <button type="button" class="gbtn" id="o-yandex" data-provider="yandex" hidden><svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="8" fill="#FC3F1D"/><path d="M13.1 17.5h1.6V6.5h-2.3c-2.3 0-3.5 1.2-3.5 2.9 0 1.4.7 2.3 1.9 3.1l-2.1 5h1.7l1.9-4.5-.6-.4c-.9-.6-1.4-1.1-1.4-2.1 0-1 .7-1.7 2-1.7h.8z" fill="#fff"/></svg><span class="lbl" data-i18n="auth.o.yandex.login">x</span><span class="dots"><i></i><i></i><i></i></span></button>
      </div>
      <div class="auth-or"><hr><span data-i18n="auth.or">or</span><hr></div>
      <form id="emailForm" novalidate>
        <div class="af"><label for="authEmail"><span data-i18n="auth.email.label">Email</span><span class="lu2" id="luEmail" data-i18n="auth.last" hidden>Last used</span></label>
        <input id="authEmail" name="email" type="email" autocomplete="email" placeholder="alan.turing@example.com" inputmode="email"></div>
        <p class="auth-err" id="authErr" hidden></p>
        <button class="gbtn auth-submit" id="submitBtn" type="submit" disabled><span class="lbl" data-i18n="auth.btn.login">Continue with email</span><span class="dots"><i></i><i></i><i></i></span></button>
      </form>
      <p class="auth-terms"><span data-i18n="auth.terms.pre.login">By signing up, you agree to our</span> <a target="_blank" href="/legal/terms/" data-i18n="auth.terms.terms">Terms</a>, <a target="_blank" href="/legal/aup/" data-i18n="auth.terms.aup">Acceptable Use</a>, <span data-i18n="auth.terms.and">and</span> <a target="_blank" href="/legal/privacy/" data-i18n="auth.terms.privacy">Privacy Policy</a>.</p>
      <p class="auth-region" data-i18n="auth.region.note">Available sign-in methods depend on your region.</p>
    </div>
    <div id="authStep2" hidden>
      <div class="auth-top">
        <img class="mark" src="/assets/logo-mark.svg" alt="Geserd">
        <h1 data-i18n="auth.code.h1">Check your email</h1>
        <p id="authCodeSub"></p>
      </div>
      <form id="codeForm" novalidate>
        <div class="af code"><label for="authCode"><span data-i18n="auth.code.label">Code</span></label>
        <input id="authCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
        <p class="auth-err" id="authErr2" hidden></p>
        <button class="gbtn auth-submit" id="verifyBtn" type="submit" disabled><span class="lbl" data-i18n="auth.code.verify">Verify and continue</span><span class="dots"><i></i><i></i><i></i></span></button>
      </form>
      <p class="auth-sub2"><button type="button" id="resendBtn" data-i18n="auth.code.resend">Resend code</button><span class="sep"></span><button type="button" id="backBtn" data-i18n="auth.code.back">Use a different email</button></p>
    </div>
  </main>
</div>
<script src="/js/boot.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
