<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log in — Geserd</title>
<meta name="description" content="Log in to your Geserd account to manage domains, API keys and sending.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/assets/favicon.svg?v=8f5dac2940">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/geserd.css?v=8f5dac2940">
</head>
<body class="auth-body" data-mode="login">
<div class="auth-shell">
  <div class="auth-bgimg"><picture><source media="(max-width:760px)" srcset="/assets/bg-site-m.webp"><img src="/assets/bg-site.webp?v=8f5dac2940" alt=""></picture></div>
  <a class="auth-home" href="/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span data-i18n="auth.home">Home</span></a>
  <div class="auth-lang" id="authLang"></div>
  <main class="auth-main">
    <div id="authStep1">
      <div class="auth-top">
        <img class="mark" src="/assets/logo-mark.svg?v=8f5dac2940" alt="Geserd">
        <h1 data-i18n="auth.login.h1">Log in to Geserd</h1>
        <p><span data-i18n="auth.foot.tosignup">Don't have an account?</span> <a href="/signup/" data-i18n="auth.foot.signuplink">Sign up</a>.</p>
      </div>
      <div class="auth-oauth" id="oauthRow" data-ready="0">
        <button type="button" class="gbtn" id="o-google" data-provider="google" hidden><svg width="24" height="24" viewBox="0 0 24 24"><defs><linearGradient id="pggo" x1="12" y1="3" x2="12" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#E5E5E5"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient></defs><path fill="url(#pggo)" d="M21.6 12.23c0-.68-.06-1.33-.17-1.96H12v3.7h5.4a4.62 4.62 0 0 1-2 3.03v2.5h3.24c1.9-1.75 2.96-4.32 2.96-7.27zM12 22c2.7 0 4.97-.9 6.63-2.43l-3.24-2.5c-.9.6-2.04.96-3.39.96-2.6 0-4.81-1.76-5.6-4.12H3.05v2.58A10 10 0 0 0 12 22zM6.4 13.9a6 6 0 0 1 0-3.8V7.52H3.05a10 10 0 0 0 0 8.96zM12 5.98c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.6 9.6 0 0 0 12 2 10 10 0 0 0 3.05 7.52L6.4 10.1C7.19 7.74 9.4 5.98 12 5.98z"/></svg><span class="lbl" data-i18n="auth.o.google.login">Log in with Google</span><span class="dots"><i></i><i></i><i></i></span></button>
        <button type="button" class="gbtn" id="o-github" data-provider="github" hidden><svg width="24" height="24" viewBox="0 0 24 24"><defs><linearGradient id="pggh" x1="12" y1="3" x2="12" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#E5E5E5"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient></defs><path fill="url(#pggh)" d="M12 3a9 9 0 0 0-2.85 17.54c.45.08.61-.19.61-.43v-1.5c-2.5.55-3.03-1.2-3.03-1.2-.41-1.04-1-1.32-1-1.32-.82-.56.06-.55.06-.55.9.06 1.38.93 1.38.93.8 1.37 2.1.98 2.61.75.08-.58.31-.98.57-1.2-2-.23-4.1-1-4.1-4.45 0-.98.35-1.79.93-2.42-.09-.23-.4-1.15.09-2.39 0 0 .76-.24 2.48.92a8.6 8.6 0 0 1 4.52 0c1.72-1.16 2.48-.92 2.48-.92.49 1.24.18 2.16.09 2.39.58.63.93 1.44.93 2.42 0 3.46-2.11 4.22-4.12 4.44.32.28.61.83.61 1.67v2.48c0 .24.16.52.62.43A9 9 0 0 0 12 3z"/></svg><span class="lbl" data-i18n="auth.o.github.login">Log in with GitHub</span><span class="dots"><i></i><i></i><i></i></span></button>
        <button type="button" class="gbtn" id="o-yandex" data-provider="yandex" hidden><svg width="24" height="24" viewBox="0 0 24 24"><defs><linearGradient id="pgya" x1="12" y1="3" x2="12" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#E5E5E5"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient></defs><path fill="url(#pgya)" d="M13.6 21h2.5V3h-3.6C9.2 3 7.5 4.7 7.5 7.3c0 2.1 1 3.3 2.8 4.5L7.3 21h2.7l3.1-8.5-.9-.6c-1.4-.9-2.1-1.8-2.1-3.5 0-1.7 1-2.7 2.6-2.7h.9z"/></svg><span class="lbl" data-i18n="auth.o.yandex.login">Log in with Yandex ID</span><span class="dots"><i></i><i></i><i></i></span></button>
      </div>
      <div class="auth-or"><hr><span data-i18n="auth.or">or</span><hr></div>
      <form id="emailForm" novalidate>
        <div class="af"><label for="authEmail"><span data-i18n="auth.email.label">Email</span><span class="lu2" id="luEmail" data-i18n="auth.last" hidden>Last used</span></label>
        <input id="authEmail" name="email" type="email" autocomplete="email" placeholder="name@example.com" inputmode="email"></div>
        <p class="auth-err" id="authErr" hidden></p>
        <button class="gbtn auth-submit" id="submitBtn" type="submit" disabled><span class="lbl" data-i18n="auth.btn.login">Continue with email</span><span class="dots"><i></i><i></i><i></i></span></button>
      </form>
      <p class="auth-terms"><span data-i18n="auth.terms.pre.login">By logging in, you agree to our</span> <a target="_blank" href="/legal/terms/" data-i18n="auth.terms.terms">Terms</a>, <a target="_blank" href="/legal/aup/" data-i18n="auth.terms.aup">Acceptable Use</a>, <span data-i18n="auth.terms.and">and</span> <a target="_blank" href="/legal/privacy/" data-i18n="auth.terms.privacy">Privacy Policy</a>.</p>
      <p class="auth-region" data-i18n="auth.region.note">Sign-in methods may differ depending on your region.</p>
    </div>
    <div id="authStep2" hidden>
      <div class="auth-top">
        <img class="mark" src="/assets/logo-mark.svg?v=8f5dac2940" alt="Geserd">
        <h1 data-i18n="auth.code.h1">Check your email</h1>
        <p id="authCodeSub"></p>
      </div>
      <form id="codeForm" novalidate>
        <div class="af code"><label for="authCode"><span data-i18n="auth.code.label">Code</span></label>
        <input id="authCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
        <p class="auth-err" id="authErr2" hidden></p>
        <button class="gbtn auth-submit" id="verifyBtn" type="submit" disabled><span class="lbl" data-i18n="auth.code.verify">Verify and continue</span><span class="dots"><i></i><i></i><i></i></span></button>
      </form>
      <p class="auth-sub2"><button type="button" id="resendBtn" data-i18n="auth.code.resend">Resend code</button><span class="sep"></span><button type="button" id="backBtn" data-i18n="auth.code.back">Use a different email</button></p>
    </div>
  </main>
</div>
<script src="/js/boot.js?v=8f5dac2940"></script>
<script src="/js/auth.js?v=8f5dac2940"></script>
</body>
</html>
